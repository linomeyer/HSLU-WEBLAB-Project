<h2 mat-dialog-title class="detail-title">{{ data.technology.name }}</h2>
<mat-dialog-content>
  <div class="chips">
    <mat-chip-set>
      <mat-chip [style.background-color]="data.color">{{ data.technology.category }}</mat-chip>
      <mat-chip>{{ data.technology.ring }}</mat-chip>
    </mat-chip-set>
  </div>

  <h3>Description</h3>
  <p>{{ data.technology.description }}</p>

  <h3>Reason</h3>
  <p>{{ data.technology.reason }}</p>

  <p class="date">Added on {{ data.technology.createdAt | date:'mediumDate' }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close class="close-button">Close</button>
</mat-dialog-actions>
