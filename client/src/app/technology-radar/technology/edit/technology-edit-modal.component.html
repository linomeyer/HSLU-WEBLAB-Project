<h2 mat-dialog-title>Edit Technology</h2>

<mat-dialog-content>
  @if (successMessage) {
    <div class="message success">{{ successMessage }}</div>
  }
  @if (errorMessage) {
    <div class="message error">{{ errorMessage }}</div>
  }

  <app-technology-form
    [technology]="data"
    [submitButtonText]="'Update Technology'"
    (formSubmit)="onFormSubmit($event)">
  </app-technology-form>

  <div class="dates">
    <p class="date">Added on {{ data.createdAt | date:'mediumDate' }}</p>
    @if (data.changedAt) {
      <p class="date">Last changed on {{ data.changedAt | date:'mediumDate' }}</p>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button color="warn" (click)="onDelete()">Delete</button>
  <div class="spacer"></div>
  <button mat-button (click)="onCancel()">Cancel</button>
</mat-dialog-actions>
